name: Deploy Budget Tracker to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  GITHUB_PAGES_BASE_PATH: ./
  VITE_SUPABASE_URL: https://wxwvboixefdivnnjaobn.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_d_rBZOYt4_SpFGMXlu8fig_6YD7Xj54
  VITE_SUPABASE_HOUSEHOLD_ID: ruru-joselle-household
  VITE_SUPABASE_LOGIN_USERNAME: narding
  VITE_SUPABASE_LOGIN_EMAIL: rj.business0416@gmail.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:github

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4